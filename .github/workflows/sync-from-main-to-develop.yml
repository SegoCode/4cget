name: Sync from main to develop

on:
  push:
    branches:
      - main

concurrency:
  group: sync-main-to-develop

jobs:
  sync_main_into_develop:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge main into develop
        run: |
          if ! git ls-remote --exit-code --heads origin develop; then
            echo "develop does not exist yet; initialization will create it."
            exit 0
          fi
          git fetch origin develop
          git checkout -B develop origin/develop
          git merge "$GITHUB_SHA" --no-edit
          git push origin develop
