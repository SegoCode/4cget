name: Warn direct PR

on:
  pull_request_target:
    types: [opened]

concurrency:
  group: warn-manual-develop-to-main-${{ github.event.pull_request.number }}

jobs:
  warn:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Warn about manual promotion PR
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const isPromotion = pr.base.ref === 'main' && pr.head.ref === 'develop';
            const isAutomated = pr.user.type === 'Bot';
            const hasAutoSync = pr.labels.some(({ name }) => name.toLowerCase() === 'auto-sync');

            if (!isPromotion || isAutomated || hasAutoSync) {
              return;
            }

            const marker = '<!-- manual-develop-to-main-warning -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100
            });

            if (comments.some(({ body }) => body?.includes(marker))) {
              return;
            }

            const workflowUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/workflows/sync-from-develop-to-main.yml`;
            const body = [
              marker,
              '> [!WARNING]',
              '> This pull request was opened manually from `develop` to `main` without the `auto-sync` label.',
              '>',
              `> The [Sync from develop to main workflow](${workflowUrl}) will close this PR and create a new promotion PR.`,
              '> Select the release type:',
              '>',
              '> - `minor`: create the next minor tag.',
              '> - `major`: create the next major tag.',
              '> - `none`: merge without creating a tag.'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body
            });
