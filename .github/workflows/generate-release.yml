name: Generate release

on:
  workflow_dispatch:
    inputs:
      release:
        description: Version increment
        required: true
        default: minor
        type: choice
        options:
          - minor
          - major

concurrency:
  group: generate-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture source commit
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Determine release version
        id: version
        env:
          RELEASE_TYPE: ${{ inputs.release }}
        run: |
          set -euo pipefail

          latest_tag=$(git tag --list --sort=-version:refname | grep -m1 -E '^[0-9]+\.[0-9]+$' || true)
          if [ -z "$latest_tag" ]; then
            new_version="1.0"
          else
            IFS=. read -r major minor <<< "$latest_tag"
            case "$RELEASE_TYPE" in
              major) new_version="$((major + 1)).0" ;;
              minor) new_version="$major.$((minor + 1))" ;;
            esac
          fi

          if git show-ref --verify --quiet "refs/tags/$new_version"; then
            echo "Tag $new_version already exists." >&2
            exit 1
          fi

          echo "version=$new_version" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: code/go.mod
          cache: false

      - name: Verify source and injected version
        working-directory: code
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          go vet ./...
          go build -trimpath -ldflags="-X main.version=$RELEASE_VERSION" -o "$RUNNER_TEMP/4cget-version-check" .
          actual=$("$RUNNER_TEMP/4cget-version-check" --version)
          test "$actual" = "4cget $RELEASE_VERSION"

  build:
    name: Build ${{ matrix.asset }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: "386"
            asset: 4cget-linux-386
          - goos: linux
            goarch: amd64
            asset: 4cget-linux-amd64
          - goos: linux
            goarch: arm
            goarm: "6"
            asset: 4cget-linux-armv6
          - goos: linux
            goarch: arm
            goarm: "7"
            asset: 4cget-linux-armv7
          - goos: linux
            goarch: arm64
            asset: 4cget-linux-arm64
          - goos: windows
            goarch: amd64
            asset: 4cget-windows-amd64.exe
          - goos: windows
            goarch: arm64
            asset: 4cget-windows-arm64.exe
          - goos: darwin
            goarch: amd64
            asset: 4cget-darwin-amd64
          - goos: darwin
            goarch: arm64
            asset: 4cget-darwin-arm64
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: code/go.mod
          cache: false

      - name: Build binary
        working-directory: code
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p ../dist
          go build -trimpath -ldflags="-s -w -X main.version=$RELEASE_VERSION" -o "../dist/${{ matrix.asset }}" .

      - name: Verify embedded version
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: strings -n 3 "dist/${{ matrix.asset }}" | grep -Fx "$RELEASE_VERSION"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish release
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          git fetch --tags --force
          if git show-ref --verify --quiet "refs/tags/$RELEASE_VERSION"; then
            echo "Tag $RELEASE_VERSION already exists." >&2
            exit 1
          fi

          assets=(dist/*)
          if [ "${#assets[@]}" -ne 9 ]; then
            echo "Expected 9 release binaries, found ${#assets[@]}." >&2
            exit 1
          fi

          gh release create "$RELEASE_VERSION" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_COMMIT" \
            --title "4cget $RELEASE_VERSION" \
            --generate-notes \
            --fail-on-no-commits \
            --latest
